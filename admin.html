<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LUXE — Admin Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800;900&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0f0f12;--card:#1a1a1f;--card2:#22222a;
--pink:#d81b60;--soft:#ff4d8d;--glow:rgba(216,27,96,.3);
--text:#fff;--sub:#aaa;--sub2:#777;
--border:rgba(216,27,96,.15);--border2:rgba(255,255,255,.06);
--success:#00c853;--warn:#ffab00;--danger:#ff1744;
--r:16px;--r2:12px;--r3:8px;
--fd:'Playfair Display',serif;--fu:'DM Sans',sans-serif
}
html{scroll-behavior:smooth}
body{font-family:var(--fu);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;line-height:1.5}
h1,h2,h3,h4{font-family:var(--fd);line-height:1.2}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,select,textarea{font-family:inherit;outline:none;border:none}
button{cursor:pointer}
input,select,textarea{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 14px;font-size:.88rem;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{border-color:var(--pink)}
input::placeholder,textarea::placeholder{color:var(--sub2)}
select option{background:var(--card);color:var(--text)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:.76rem;font-weight:600;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:var(--r2);font-weight:600;font-size:.85rem;transition:all .25s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-p{background:linear-gradient(135deg,var(--pink),var(--soft));color:#fff}
.btn-p:hover{box-shadow:0 0 24px var(--glow);transform:translateY(-1px)}
.btn-o{background:transparent;border:1px solid var(--pink);color:var(--soft)}
.btn-o:hover{background:rgba(216,27,96,.1)}
.btn-g{background:transparent;color:var(--sub);padding:8px 12px}
.btn-g:hover{color:var(--text)}
.btn-d{background:rgba(255,23,68,.12);color:var(--danger);border:1px solid rgba(255,23,68,.25)}
.btn-d:hover{background:rgba(255,23,68,.2)}
.btn-sm{padding:6px 14px;font-size:.78rem;border-radius:var(--r3)}
.btn-block{width:100%}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.badge-p{background:rgba(216,27,96,.18);color:var(--soft)}
.badge-g{background:rgba(0,200,83,.14);color:var(--success)}
.badge-y{background:rgba(255,171,0,.14);color:var(--warn)}
.badge-r{background:rgba(255,23,68,.14);color:var(--danger)}
.hidden{display:none!important}
.glass{background:rgba(26,26,31,.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:var(--r)}
.glow-box{box-shadow:0 0 40px var(--glow),0 8px 32px rgba(0,0,0,.4)}
.alayout{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--card);border-right:1px solid var(--border);padding:18px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;transition:transform .3s}
.slogo{font-family:var(--fd);font-weight:900;font-size:1.3rem;background:linear-gradient(135deg,var(--pink),var(--soft));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;padding:0 20px 18px;border-bottom:1px solid var(--border);margin-bottom:10px}
.slogo span{font-size:.62rem;display:block;letter-spacing:1px;-webkit-text-fill-color:var(--sub);font-family:var(--fu);font-weight:500;margin-top:2px}
.ni{display:flex;align-items:center;gap:12px;padding:11px 20px;color:var(--sub);font-size:.88rem;font-weight:500;cursor:pointer;transition:all .2s;border-left:3px solid transparent}
.ni:hover{color:var(--text);background:rgba(255,255,255,.03)}
.ni.on{color:var(--soft);background:rgba(216,27,96,.08);border-left-color:var(--pink)}
.ni i{width:20px;text-align:center;font-size:.95rem}
.mc{flex:1;margin-left:250px;padding:24px 28px;min-height:100vh}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.ph h1{font-size:1.45rem;font-weight:700}
.mtog{display:none;position:fixed;top:12px;left:12px;z-index:60;width:40px;height:40px;border-radius:var(--r2);background:var(--card);border:1px solid var(--border);color:var(--text);align-items:center;justify-content:center;font-size:1.1rem}
.sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
.sov.on{display:block}
.srow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:28px}
.sc{padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2);transition:all .3s}
.sc:hover{box-shadow:0 0 30px var(--glow)}
.sc .si{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:12px;color:#fff}
.sc .sv{font-size:1.5rem;font-weight:800;font-family:var(--fd)}
.sc .sl{font-size:.72rem;color:var(--sub);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border2);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.83rem}
th{text-align:left;padding:12px 14px;color:var(--sub);font-weight:600;font-size:.71rem;text-transform:uppercase;letter-spacing:.4px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.ti{width:44px;height:56px;border-radius:var(--r3);object-fit:cover}
.ta{display:flex;gap:6px}
.mov{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px)}
.mov.on{display:flex}
.mod{width:100%;max-width:620px;max-height:90vh;overflow-y:auto;padding:28px 24px;position:relative;animation:mI .25s ease}
@keyframes mI{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
.mcl{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);color:var(--sub);display:flex;align-items:center;justify-content:center;transition:all .2s}
.mcl:hover{color:var(--text);background:rgba(255,255,255,.14)}
.mod h2{font-size:1.2rem;margin-bottom:20px}
.iug{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.iub{width:76px;height:76px;border-radius:var(--r2);border:2px dashed var(--border2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sub2);font-size:1.1rem;transition:all .25s;position:relative;overflow:hidden}
.iub:hover{border-color:var(--pink);color:var(--soft)}
.iub img{width:100%;height:100%;object-fit:cover}
.iub .rix{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.75);color:#fff;font-size:.55rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.oex{display:none;padding:14px;background:rgba(255,255,255,.02);border-top:1px solid var(--border2)}
.oex.on{display:block}
.dr{display:flex;gap:8px;padding:5px 0;font-size:.82rem}
.dr .dl{color:var(--sub);min-width:110px}
.dr .dv{color:var(--text);font-weight:500}
.empty{text-align:center;padding:45px 20px;color:var(--sub)}
.empty i{font-size:2.2rem;margin-bottom:12px;color:var(--pink);opacity:.45}
.empty h3{font-family:var(--fu);font-weight:600;margin-bottom:4px;color:var(--text);font-size:.95rem}
#toasts{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 16px;border-radius:var(--r2);font-size:.85rem;font-weight:500;pointer-events:auto;animation:tI .3s ease;display:flex;align-items:center;gap:10px;max-width:380px}
.toast.s{background:rgba(0,200,83,.14);border:1px solid rgba(0,200,83,.28);color:var(--success)}
.toast.e{background:rgba(255,23,68,.14);border:1px solid rgba(255,23,68,.28);color:var(--danger)}
.toast.i{background:rgba(216,27,96,.14);border:1px solid rgba(216,27,96,.28);color:var(--soft)}
@keyframes tI{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.toast.out{animation:tO .3s ease forwards}
@keyframes tO{to{opacity:0;transform:translateX(30px)}}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{width:100%;max-width:400px;padding:32px 28px}
.inf-det{padding:20px;margin-bottom:16px;border-radius:var(--r);background:var(--card);border:1px solid var(--border2)}
.inf-det h3{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.inf-det h3 i{color:var(--soft)}
@media(max-width:768px){
.sidebar{transform:translateX(-100%)}
.sidebar.open{transform:translateX(0)}
.mtog{display:flex}
.mc{margin-left:0;padding:16px;padding-top:60px}
.srow{grid-template-columns:1fr 1fr}
.ph h1{font-size:1.15rem}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:0s!important;transition-duration:0s!important}}
</style>
</head>
<body>

<button class="mtog" onclick="Ad.togSB()"><i class="fas fa-bars"></i></button>
<div class="sov" id="sov" onclick="Ad.togSB()"></div>

<div id="admin-login" class="lw">
<div class="lc glass glow-box">
<h2 style="text-align:center;font-size:1.4rem;margin-bottom:4px">LUXE Admin</h2>
<p style="text-align:center;color:var(--sub);font-size:.84rem;margin-bottom:24px">Sign in to manage your store</p>
<div class="fg"><label>Email</label><input type="email" id="al-e" placeholder="admin@luxe.com"></div>
<div class="fg"><label>Password</label><input type="password" id="al-p" placeholder="Password"></div>
<button class="btn btn-p btn-block" style="margin-top:8px" onclick="Ad.adminLogin()">Login</button>
<p style="text-align:center;color:var(--sub2);font-size:.74rem;margin-top:16px">Demo: admin@luxe.com / admin123</p>
</div>
</div>

<div class="alayout hidden" id="admin-app">
<aside class="sidebar" id="sb">
<div class="slogo">LUXE<span>Admin Panel</span></div>
<div class="ni on" data-p="dashboard" onclick="Ad.nav('dashboard')"><i class="fas fa-th-large"></i>Dashboard</div>
<div class="ni" data-p="products" onclick="Ad.nav('products')"><i class="fas fa-box"></i>Products</div>
<div class="ni" data-p="orders" onclick="Ad.nav('orders')"><i class="fas fa-shopping-cart"></i>Orders</div>
<div class="ni" data-p="influencers" onclick="Ad.nav('influencers')"><i class="fas fa-star"></i>Influencers</div>
<div style="flex:1"></div>
<div class="ni" onclick="window.open('index.html','_blank')"><i class="fas fa-external-link-alt"></i>View Store</div>
<div class="ni" onclick="Ad.adminLogout()" style="color:var(--danger)"><i class="fas fa-sign-out-alt"></i>Logout</div>
</aside>
<div class="mc" id="mc"></div>
</div>

<div class="mov" id="pmov">
<div class="mod glass glow-box">
<button class="mcl" onclick="Ad.closePM()"><i class="fas fa-times"></i></button>
<h2 id="pm-title">Add Product</h2>
<div class="fg"><label>Product Name</label><input type="text" id="pm-n" placeholder="Enter product name"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div class="fg"><label>Selling Price</label><input type="number" id="pm-pr" placeholder="999"></div>
<div class="fg"><label>Original Price</label><input type="number" id="pm-op" placeholder="1999"></div>
</div>
<div class="fg"><label>Category</label><select id="pm-cat"><option value="Sarees">Sarees</option><option value="Kurtis">Kurtis</option><option value="Lehengas">Lehengas</option><option value="Jewellery">Jewellery</option><option value="Accessories">Accessories</option><option value="Footwear">Footwear</option></select></div>
<div class="fg"><label>Description</label><textarea id="pm-desc" rows="3" placeholder="Product description"></textarea></div>
<div class="fg"><label>Upload Images</label><div class="iug" id="pm-ig"><div class="iub" onclick="document.getElementById('pm-fi').click()"><i class="fas fa-plus"></i></div></div><input type="file" id="pm-fi" accept="image/*" multiple style="display:none" onchange="Ad.handleImgUp(event)"></div>
<div class="fg"><label>Image URLs (one per line, optional)</label><textarea id="pm-urls" rows="2" placeholder="https://example.com/img.jpg"></textarea></div>
<div id="pm-preview" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"></div>
<button class="btn btn-p btn-block" onclick="Ad.saveProd()">Save Product</button>
</div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================
   LUXE Admin Panel — Complete
   Supabase (when configured) / localStorage (demo mode)
   ============================================================ */

// ── CONFIG: Apna Supabase credentials yahan daalo ──
const SB_URL = '';
const SB_KEY = '';
const USE_SB = !!(SB_URL && SB_KEY);
let sb = null;
if (USE_SB) sb = window.supabase.createClient(SB_URL, SB_KEY);

// ── Helpers ──
const fp = n => '\u20B9' + Number(n).toLocaleString('en-IN');
function ls(k, v) {
  if (v !== undefined) { localStorage.setItem(k, JSON.stringify(v)); return; }
  try { return JSON.parse(localStorage.getItem(k)); } catch { return null; }
}
function toast(msg, type) {
  type = type || 'i';
  var c = document.getElementById('toasts');
  var t = document.createElement('div');
  var cls = type === 's' ? 's' : type === 'e' ? 'e' : 'i';
  var ico = cls === 's' ? 'fa-check-circle' : cls === 'e' ? 'fa-exclamation-circle' : 'fa-info-circle';
  t.className = 'toast ' + cls;
  t.innerHTML = '<i class="fas ' + ico + '"></i><span>' + msg + '</span>';
  c.appendChild(t);
  setTimeout(function() { t.classList.add('out'); setTimeout(function() { t.remove(); }, 300); }, 3200);
}

// ── Demo Data Seed ──
function seedDemo() {
  if (localStorage.getItem('lx_sd')) return;
  var prods = [
    {id:'p1',name:'Silk Embroidered Saree',price:1299,original_price:2499,category:'Sarees',description:'Handcrafted silk saree with intricate floral embroidery. Perfect for weddings and festive occasions.',images:['https://picsum.photos/seed/saree1/600/800','https://picsum.photos/seed/saree2/600/800','https://picsum.photos/seed/saree3/600/800'],featured:true},
    {id:'p2',name:'Designer A-Line Kurti',price:799,original_price:1599,category:'Kurtis',description:'Elegant A-line kurti in premium cotton with delicate thread work.',images:['https://picsum.photos/seed/kurti1/600/800','https://picsum.photos/seed/kurti2/600/800'],featured:true},
    {id:'p3',name:'Bridal Lehenga Set',price:3499,original_price:6999,category:'Lehengas',description:'Stunning bridal lehenga with heavy zari and stone work. Includes dupatta and blouse.',images:['https://picsum.photos/seed/leh1/600/800','https://picsum.photos/seed/leh2/600/800'],featured:true},
    {id:'p4',name:'Gold Plated Necklace Set',price:599,original_price:1199,category:'Jewellery',description:'Exquisite gold-plated necklace set with kundan and pearl detailing.',images:['https://picsum.photos/seed/jwl1/600/800'],featured:false},
    {id:'p5',name:'Embroidered Clutch Bag',price:449,original_price:899,category:'Accessories',description:'Hand-embroidered potli clutch bag with drawstring closure.',images:['https://picsum.photos/seed/clu1/600/800'],featured:false},
    {id:'p6',name:'Block Heel Sandals',price:699,original_price:1399,category:'Footwear',description:'Comfortable block heel sandals with cushioned insole.',images:['https://picsum.photos/seed/heel1/600/800'],featured:false},
    {id:'p7',name:'Printed Anarkali Suit',price:1099,original_price:2199,category:'Kurtis',description:'Flowy anarkali suit with digital floral print. Comes with churidar and dupatta.',images:['https://picsum.photos/seed/ana1/600/800','https://picsum.photos/seed/ana2/600/800'],featured:true},
    {id:'p8',name:'Pearl Drop Earrings',price:349,original_price:699,category:'Jewellery',description:'Classic pearl drop earrings with gold-plated setting.',images:['https://picsum.photos/seed/ear1/600/800'],featured:false},
    {id:'p9',name:'Banarasi Silk Saree',price:1899,original_price:3799,category:'Sarees',description:'Pure Banarasi silk saree with rich gold zari weave. A timeless heirloom piece.',images:['https://picsum.photos/seed/ban1/600/800','https://picsum.photos/seed/ban2/600/800'],featured:true},
    {id:'p10',name:'Designer Embroidered Jutti',price:549,original_price:1099,category:'Footwear',description:'Handcrafted mojari jutti with intricate thread and zari embroidery.',images:['https://picsum.photos/seed/jut1/600/800'],featured:false}
  ];
  var users = [
    {id:'u_admin',name:'Admin',email:'admin@luxe.com',phone:'9999999999',password:'admin123',role:'admin',referral_code:null,created_at:new Date().toISOString()},
    {id:'u_demo',name:'Priya Sharma',email:'priya@demo.com',phone:'9876543210',password:'demo123',role:'influencer',referral_code:'PRIYA20',created_at:new Date().toISOString()}
  ];
  var orders = [
    {id:'ord001',user_id:'u_c1',items:[{product_id:'p1',qty:1,price:1299}],amount:1299,status:'delivered',customer_name:'Rahul K.',customer_phone:'9988776655',customer_address:'42 Marine Drive, Mumbai 400020',referral_code:'PRIYA20',influencer_id:'u_demo',influencer_name:'Priya Sharma',commission:259.8,created_at:new Date(Date.now()-5*864e5).toISOString()},
    {id:'ord002',user_id:'u_c2',items:[{product_id:'p3',qty:1,price:3499}],amount:3499,status:'shipped',customer_name:'Sneha P.',customer_phone:'9876501234',customer_address:'15 Connaught Place, New Delhi 110001',referral_code:'PRIYA20',influencer_id:'u_demo',influencer_name:'Priya Sharma',commission:0,created_at:new Date(Date.now()-2*864e5).toISOString()},
    {id:'ord003',user_id:'u_c3',items:[{product_id:'p7',qty:2,price:1099}],amount:2198,status:'delivered',customer_name:'Amit R.',customer_phone:'9123456789',customer_address:'88 Brigade Road, Bangalore 560025',referral_code:'PRIYA20',influencer_id:'u_demo',influencer_name:'Priya Sharma',commission:439.6,created_at:new Date(Date.now()-10*864e5).toISOString()},
    {id:'ord004',user_id:'u_c4',items:[{product_id:'p4',qty:1,price:599}],amount:599,status:'pending',customer_name:'Divya M.',customer_phone:'9111222333',customer_address:'Park Street, Kolkata 700016',referral_code:null,influencer_id:null,influencer_name:null,commission:0,created_at:new Date().toISOString()}
  ];
  ls('lx_prods', prods);
  ls('lx_users', users);
  ls('lx_orders', orders);
  localStorage.setItem('lx_sd', '1');
}

// ── Database Layer ──
var DB = {
  getProducts: async function() {
    if (USE_SB) {
      var r = await sb.from('products').select('*').order('created_at', {ascending:false});
      return (r.data || []).map(function(p) { return Object.assign({}, p, {images: p.images || []}); });
    }
    return ls('lx_prods') || [];
  },
  saveProduct: async function(p) {
    if (USE_SB) {
      var r = await sb.from('products').upsert({id:p.id,name:p.name,price:p.price,original_price:p.original_price,category:p.category,description:p.description,images:p.images,featured:p.featured||false}).select().single();
      return r.data;
    }
    var prods = ls('lx_prods') || [];
    var idx = -1;
    for (var i = 0; i < prods.length; i++) { if (prods[i].id === p.id) { idx = i; break; } }
    if (idx > -1) prods[idx] = p; else prods.push(p);
    ls('lx_prods', prods);
    return p;
  },
  deleteProduct: async function(id) {
    if (USE_SB) { await sb.from('products').delete().eq('id', id); return; }
    var prods = (ls('lx_prods') || []).filter(function(p) { return p.id !== id; });
    ls('lx_prods', prods);
  },
  getOrders: async function() {
    if (USE_SB) {
      var r = await sb.from('orders').select('*').order('created_at', {ascending:false});
      return r.data || [];
    }
    return (ls('lx_orders') || []).sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
  },
  updateOrder: async function(id, updates) {
    if (USE_SB) {
      var r = await sb.from('orders').update(updates).eq('id', id).select().single();
      return r.data;
    }
    var orders = ls('lx_orders') || [];
    for (var i = 0; i < orders.length; i++) {
      if (orders[i].id === id) {
        for (var k in updates) orders[i][k] = updates[k];
        break;
      }
    }
    ls('lx_orders', orders);
    return orders[i] || null;
  },
  getInfluencers: async function() {
    if (USE_SB) {
      var r = await sb.from('profiles').select('*').eq('role', 'influencer').order('created_at', {ascending:false});
      return r.data || [];
    }
    return (ls('lx_users') || []).filter(function(u) { return u.role === 'influencer'; });
  },
  getInfOrders: async function(infId) {
    if (USE_SB) {
      var r = await sb.from('orders').select('*').eq('influencer_id', infId).order('created_at', {ascending:false});
      return r.data || [];
    }
    return (ls('lx_orders') || []).filter(function(o) { return o.influencer_id === infId; }).sort(function(a,b) { return new Date(b.created_at) - new Date(a.created_at); });
  },
  adminLogin: async function(email, password) {
    if (USE_SB) {
      var r = await sb.auth.signInWithPassword({email: email, password: password});
      if (r.error) throw r.error;
      var p = await sb.from('profiles').select('*').eq('id', r.data.user.id).single();
      if (!p.data || p.data.role !== 'admin') throw new Error('Not an admin account');
      return Object.assign({}, r.data.user, p.data);
    }
    var users = ls('lx_users') || [];
    for (var i = 0; i < users.length; i++) {
      if (users[i].email === email && users[i].password === password && users[i].role === 'admin') {
        ls('lx_admin_session', users[i].id);
        return users[i];
      }
    }
    throw new Error('Invalid admin credentials');
  },
  adminLogout: async function() {
    if (USE_SB) await sb.auth.signOut();
    localStorage.removeItem('lx_admin_session');
  }
};

// ── Admin State ──
var Ad = {
  user: null,
  page: 'dashboard',
  prods: [],
  orders: [],
  editId: null,
  editImgs: [],
  orderFilter: 'all',
  expandedInf: null
};

// ── Init ──
async function initAdmin() {
  if (!USE_SB) seedDemo();
  if (USE_SB) {
    try {
      var r = await sb.auth.getSession();
      if (r.data.session) {
        var p = await sb.from('profiles').select('*').eq('id', r.data.session.user.id).single();
        if (p.data && p.data.role === 'admin') {
          Ad.user = Object.assign({}, r.data.session.user, p.data);
        }
      }
    } catch(e) {}
  } else {
    var sid = ls('lx_admin_session');
    if (sid) {
      var users = ls('lx_users') || [];
      for (var i = 0; i < users.length; i++) {
        if (users[i].id === sid) { Ad.user = users[i]; break; }
      }
    }
  }
  if (Ad.user) showApp(); else showLogin();
}

function showLogin() {
  document.getElementById('admin-login').classList.remove('hidden');
  document.getElementById('admin-app').classList.add('hidden');
}
function showApp() {
  document.getElementById('admin-login').classList.add('hidden');
  document.getElementById('admin-app').classList.remove('hidden');
  Ad.nav('dashboard');
}

async function adminLogin() {
  var e = document.getElementById('al-e').value.trim();
  var p = document.getElementById('al-p').value;
  if (!e || !p) { toast('Fill all fields', 'e'); return; }
  try {
    Ad.user = await DB.adminLogin(e, p);
    showApp();
    toast('Welcome, Admin', 's');
  } catch(err) {
    toast(err.message || 'Login failed', 'e');
  }
}

async function adminLogout() {
  await DB.adminLogout();
  Ad.user = null;
  showLogin();
  toast('Logged out', 'i');
}

function togSB() {
  document.getElementById('sb').classList.toggle('open');
  document.getElementById('sov').classList.toggle('open');
}

// ── Navigate ──
async function nav(page) {
  Ad.page = page;
  var items = document.querySelectorAll('.ni[data-p]');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle('on', items[i].getAttribute('data-p') === page);
  }
  document.getElementById('sb').classList.remove('open');
  document.getElementById('sov').classList.remove('open');
  Ad.prods = await DB.getProducts();
  Ad.orders = await DB.getOrders();
  Ad.orderFilter = 'all';
  Ad.expandedInf = null;
  var el = document.getElementById('mc');
  if (page === 'dashboard') renderDash(el);
  else if (page === 'products') renderProds(el);
  else if (page === 'orders') renderOrds(el);
  else if (page === 'influencers') renderInfs(el);
}

function sBadge(s) {
  var m = {pending:'badge-y',confirmed:'badge-p',shipped:'badge-p',delivered:'badge-g',cancelled:'badge-r'};
  return '<span class="badge ' + (m[s]||'badge-y') + '">' + s.charAt(0).toUpperCase() + s.slice(1) + '</span>';
}
function sCard(icon, label, val, grad) {
  return '<div class="sc"><div class="si" style="background:' + grad + '"><i class="fas ' + icon + '"></i></div><div class="sv">' + val + '</div><div class="sl">' + label + '</div></div>';
}

// ── Dashboard ──
function renderDash(el) {
  var rev = 0, comm = 0, pend = 0, ship = 0;
  for (var i = 0; i < Ad.orders.length; i++) {
    var o = Ad.orders[i];
    if (o.status === 'delivered') { rev += o.amount; comm += (o.commission || 0); }
    if (o.status === 'pending') pend++;
    if (o.status === 'shipped') ship++;
  }
  var h = '<div class="ph"><h1>Dashboard</h1><span style="color:var(--sub);font-size:.84rem">' + new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}) + '</span></div>';
  h += '<div class="srow">';
  h += sCard('fa-wallet','Revenue',fp(rev),'linear-gradient(135deg,var(--pink),var(--soft))');
  h += sCard('fa-shopping-cart','Orders',Ad.orders.length,'linear-gradient(135deg,#6a1b9a,#ab47bc)');
  h += sCard('fa-box','Products',Ad.prods.length,'linear-gradient(135deg,#00838f,#26c6da)');
  h += sCard('fa-hand-holding-usd','Commission Paid',fp(comm),'linear-gradient(135deg,#1b5e20,#66bb6a)');
  h += sCard('fa-clock','Pending',pend,'linear-gradient(135deg,#e65100,#ff9800)');
  h += sCard('fa-truck','Shipped',ship,'linear-gradient(135deg,#283593,#5c6bc0)');
  h += '</div>';
  h += '<h3 style="margin-bottom:14px;font-size:1.05rem">Recent Orders</h3><div class="tw">';
  if (!Ad.orders.length) {
    h += '<div class="empty"><i class="fas fa-inbox"></i><h3>No orders yet</h3></div>';
  } else {
    h += '<table><thead><tr><th>Order ID</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead><tbody>';
    var limit = Math.min(Ad.orders.length, 10);
    for (var i = 0; i < limit; i++) {
      var o = Ad.orders[i];
      h += '<tr><td style="font-weight:600;font-size:.8rem">' + o.id + '</td><td>' + (o.customer_name||'N/A') + '</td><td style="font-weight:700;color:var(--soft)">' + fp(o.amount) + '</td><td>' + sBadge(o.status) + '</td><td style="color:var(--sub);font-size:.8rem">' + new Date(o.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';
  el.innerHTML = h;
}

// ── Products ──
function renderProds(el) {
  var h = '<div class="ph"><h1>Products</h1><button class="btn btn-p" onclick="Ad.openPM()"><i class="fas fa-plus"></i> Add Product</button></div>';
  if (!Ad.prods.length) {
    h += '<div class="empty"><i class="fas fa-box-open"></i><h3>No products yet</h3></div>';
  } else {
    h += '<div class="tw"><table><thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Original</th><th>Discount</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < Ad.prods.length; i++) {
      var p = Ad.prods[i];
      var d = Math.round((1 - p.price / p.original_price) * 100);
      h += '<tr><td><img class="ti" src="' + p.images[0] + '" alt="' + p.name + '"></td>';
      h += '<td style="font-weight:600;max-width:160px">' + p.name + '</td>';
      h += '<td><span class="badge badge-p">' + p.category + '</span></td>';
      h += '<td style="font-weight:700;color:var(--soft)">' + fp(p.price) + '</td>';
      h += '<td style="color:var(--sub2);text-decoration:line-through">' + fp(p.original_price) + '</td>';
      h += '<td style="color:var(--success);font-weight:600">' + d + '%</td>';
      h += '<td><div class="ta"><button class="btn btn-o btn-sm" onclick="Ad.openPM(\'' + p.id + '\')"><i class="fas fa-edit"></i></button><button class="btn btn-d btn-sm" onclick="Ad.delProd(\'' + p.id + '\')"><i class="fas fa-trash"></i></button></div></td></tr>';
    }
    h += '</tbody></table></div>';
  }
  el.innerHTML = h;
}

function openPM(id) {
  Ad.editId = id || null;
  Ad.editImgs = [];
  document.getElementById('pm-title').textContent = id ? 'Edit Product' : 'Add Product';
  document.getElementById('pm-n').value = '';
  document.getElementById('pm-pr').value = '';
  document.getElementById('pm-op').value = '';
  document.getElementById('pm-cat').value = 'Sarees';
  document.getElementById('pm-desc').value = '';
  document.getElementById('pm-urls').value = '';
  if (id) {
    for (var i = 0; i < Ad.prods.length; i++) {
      if (Ad.prods[i].id === id) {
        var p = Ad.prods[i];
        document.getElementById('pm-n').value = p.name;
        document.getElementById('pm-pr').value = p.price;
        document.getElementById('pm-op').value = p.original_price;
        document.getElementById('pm-cat').value = p.category;
        document.getElementById('pm-desc').value = p.description;
        Ad.editImgs = p.images.slice();
        break;
      }
    }
  }
  renderImgGrid();
  updPreview();
  document.getElementById('pmov').classList.add('on');
}
function closePM() { document.getElementById('pmov').classList.remove('on'); }

async function delProd(id) {
  if (!confirm('Delete this product?')) return;
  await DB.deleteProduct(id);
  toast('Product deleted', 's');
  nav('products');
}

function handleImgUp(e) {
  var files = Array.from(e.target.files);
  for (var i = 0; i < files.length; i++) {
    (function(file) {
      var reader = new FileReader();
      reader.onload = function(ev) {
        Ad.editImgs.push(ev.target.result);
        renderImgGrid();
        updPreview();
      };
      reader.readAsDataURL(file);
    })(files[i]);
  }
  e.target.value = '';
}

function rmImg(idx) {
  Ad.editImgs.splice(idx, 1);
  renderImgGrid();
  updPreview();
}

function renderImgGrid() {
  var g = document.getElementById('pm-ig');
  var h = '';
  for (var i = 0; i < Ad.editImgs.length; i++) {
    h += '<div class="iub"><img src="' + Ad.editImgs[i] + '"><div class="rix" onclick="rmImg(' + i + ')"><i class="fas fa-times"></i></div></div>';
  }
  if (Ad.editImgs.length < 6) {
    h += '<div class="iub" onclick="document.getElementById(\'pm-fi\').click()"><i class="fas fa-plus"></i></div>';
  }
  g.innerHTML = h;
}

function updPreview() {
  var p = document.getElementById('pm-preview');
  var urls = document.getElementById('pm-urls').value.trim().split('\n').filter(function(u) { return u.trim(); });
  var all = Ad.editImgs.concat(urls.map(function(u) { return u.trim(); })).filter(Boolean);
  var h = '';
  for (var i = 0; i < all.length; i++) {
    h += '<img src="' + all[i] + '" style="width:52px;height:52px;border-radius:var(--r3);object-fit:cover;border:1px solid var(--border2)">';
  }
  p.innerHTML = h;
}

// Live preview on URL input change
document.getElementById('pm-urls').addEventListener('input', updPreview);

async function saveProd() {
  var n = document.getElementById('pm-n').value.trim();
  var pr = parseInt(document.getElementById('pm-pr').value);
  var op = parseInt(document.getElementById('pm-op').value);
  var cat = document.getElementById('pm-cat').value;
  var desc = document.getElementById('pm-desc').value.trim();
  var urlText = document.getElementById('pm-urls').value.trim();
  var urls = urlText ? urlText.split('\n').filter(function(u) { return u.trim(); }).map(function(u) { return u.trim(); }) : [];
  if (!n) { toast('Product name required', 'e'); return; }
  if (!pr || pr <= 0) { toast('Valid selling price required', 'e'); return; }
  if (!op || op <= pr) { toast('Original price must be higher', 'e'); return; }
  var imgs = Ad.editImgs.concat(urls).filter(Boolean);
  if (!imgs.length) { toast('At least one image required', 'e'); return; }
  var prod = {
    id: Ad.editId || 'p_' + Date.now(),
    name: n, price: pr, original_price: op,
    category: cat, description: desc,
    images: imgs, featured: false
  };
  await DB.saveProduct(prod);
  toast(Ad.editId ? 'Product updated' : 'Product added', 's');
  closePM();
  nav('products');
}

// ── Orders ──
function renderOrds(el) {
  var statuses = ['all','pending','confirmed','shipped','delivered','cancelled'];
  var filtered = Ad.orderFilter === 'all' ? Ad.orders : Ad.orders.filter(function(o) { return o.status === Ad.orderFilter; });

  var h = '<div class="ph"><h1>Orders</h1><div style="display:flex;gap:6px;flex-wrap:wrap">';
  for (var s = 0; s < statuses.length; s++) {
    var st = statuses[s];
    var cnt = st === 'all' ? Ad.orders.length : Ad.orders.filter(function(o) { return o.status === st; }).length;
    h += '<button class="btn btn-sm ' + (Ad.orderFilter === st ? 'btn-p' : 'btn-o') + '" onclick="Ad.filtOrd(\'' + st + '\')" style="font-size:.72rem;padding:5px 12px">' + (st === 'all' ? 'All' : st.charAt(0).toUpperCase() + st.slice(1)) + ' (' + cnt + ')</button>';
  }
  h += '</div></div>';

  if (!filtered.length) {
    h += '<div class="empty"><i class="fas fa-inbox"></i><h3>No orders found</h3></div>';
  } else {
    h += '<div class="tw"><table><thead><tr><th>Order</th><th>Customer</th><th>Phone</th><th>Products</th><th>Amount</th><th>Status</th><th>Referral</th><th>Actions</th></tr></thead><tbody>';
    for (var i = 0; i < filtered.length; i++) {
      var o = filtered[i];
      var pNames = [];
      for (var j = 0; j < (o.items || []).length; j++) {
        var it = o.items[j];
        var found = false;
        for (var k = 0; k < Ad.prods.length; k++) {
          if (Ad.prods[k].id === it.product_id) {
            pNames.push(Ad.prods[k].name + (it.qty > 1 ? ' x' + it.qty : ''));
            found = true;
            break;
          }
        }
        if (!found) pNames.push('Unknown');
      }
      var pnStr = pNames.join(', ');
      h += '<tr>';
      h += '<td style="font-weight:600;font-size:.8rem;color:var(--soft);cursor:pointer" onclick="Ad.togOEx(\'' + o.id + '\')">' + o.id + ' <i class="fas fa-chevron-down" style="font-size:.55rem;color:var(--sub2)"></i></td>';
      h += '<td>' + (o.customer_name || 'N/A') + '</td>';
      h += '<td style="font-size:.82rem">' + (o.customer_phone || 'N/A') + '</td>';
      h += '<td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem" title="' + pnStr + '">' + pnStr + '</td>';
      h += '<td style="font-weight:700;color:var(--soft)">' + fp(o.amount) + '</td>';
      h += '<td>' + sBadge(o.status) + '</td>';
      h += '<td style="font-size:.8rem;color:var(--sub2)">' + (o.referral_code || '--') + '</td>';
      h += '<td><select onchange="Ad.updStatus(\'' + o.id + '\',this.value)" style="padding:5px 8px;font-size:.78rem;border-radius:var(--r3);width:auto;min-width:100px">';
      var stArr = ['pending','confirmed','shipped','delivered','cancelled'];
      for (var x = 0; x < stArr.length; x++) {
        h += '<option value="' + stArr[x] + '"' + (o.status === stArr[x] ? ' selected' : '') + '>' + stArr[x].charAt(0).toUpperCase() + stArr[x].slice(1) + '</option>';
      }
      h += '</select></td></tr>';
      // Expanded detail row
      h += '<tr><td colspan="8" style="padding:0"><div class="oex" id="oex-' + o.id + '">';
      h += '<div class="dr"><span class="dl">Full Address</span><span class="dv">' + (o.customer_address || 'N/A') + '</span></div>';
      h += '<div class="dr"><span class="dl">Influencer</span><span class="dv">' + (o.influencer_name || 'None') + '</span></div>';
      h += '<div class="dr"><span class="dl">Commission</span><span class="dv" style="color:' + (o.commission > 0 ? 'var(--success)' : 'var(--sub2)') + '">' + (o.commission > 0 ? fp(o.commission) : 'Not yet (20% on delivery)') + '</span></div>';
      h += '<div class="dr"><span class="dl">Placed On</span><span class="dv">' + new Date(o.created_at).toLocaleString('en-IN') + '</span></div>';
      h += '<div style="display:flex;gap:8px;margin-top:8px">';
      for (var j = 0; j < (o.items || []).length; j++) {
        var it = o.items[j];
        for (var k = 0; k < Ad.prods.length; k++) {
          if (Ad.prods[k].id === it.product_id) {
            h += '<img src="' + Ad.prods[k].images[0] + '" style="width:50px;height:65px;border-radius:var(--r3);object-fit:cover">';
            break;
          }
        }
      }
      h += '</div></div></td></tr>';
    }
    h += '</tbody></table></div>';
  }
  el.innerHTML = h;
}

function filtOrd(status) {
  Ad.orderFilter = status;
  renderOrds(document.getElementById('mc'));
}

function togOEx(id) {
  var el = document.getElementById('oex-' + id);
  if (el) el.classList.toggle('on');
}

async function updStatus(id, newStatus) {
  var updates = { status: newStatus };
  // Commission logic: sirf delivered hone par 20%
  if (newStatus === 'delivered') {
    var order = null;
    for (var i = 0; i < Ad.orders.length; i++) {
      if (Ad.orders[i].id === id) { order = Ad.orders[i]; break; }
    }
    if (order && order.referral_code && order.influencer_id) {
      updates.commission = Math.round(order.amount * 0.20 * 100) / 100;
      toast('Commission ' + fp(updates.commission) + ' credited to ' + (order.influencer_name || 'influencer'), 's');
    }
  } else {
    updates.commission = 0;
  }
  await DB.updateOrder(id, updates);
  toast('Order status updated to ' + newStatus, 's');
  // Refresh
  Ad.orders = await DB.getOrders();
  renderOrds(document.getElementById('mc'));
}

// ── Influencers ──
async function renderInfs(el) {
  var infs = await DB.getInfluencers();
  var h = '<div class="ph"><h1>Influencers</h1><span style="color:var(--sub);font-size:.84rem">' + infs.length + ' registered</span></div>';

  if (!infs.length) {
    h += '<div class="empty"><i class="fas fa-star"></i><h3>No influencers yet</h3><p>They will appear here after signup</p></div>';
  } else {
    for (var i = 0; i < infs.length; i++) {
      var inf = infs[i];
      var infOrders = await DB.getInfOrders(inf.id);
      var delivered = infOrders.filter(function(o) { return o.status === 'delivered'; });
      var totalEarn = 0;
      for (var j = 0; j < delivered.length; j++) totalEarn += (delivered[j].commission || 0);
      var isExpanded = Ad.expandedInf === inf.id;

      h += '<div class="inf-det" style="cursor:pointer' + (isExpanded ? ';border-color:var(--pink)' : '') + '" onclick="Ad.togInf(\'' + inf.id + '\')">';
      h += '<h3><i class="fas fa-star"></i> ' + inf.name + ' <span class="badge badge-p" style="margin-left:8px">' + inf.referral_code + '</span></h3>';
      h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:4px">';
      h += '<div><div style="font-size:.7rem;color:var(--sub2);text-transform:uppercase;letter-spacing:.4px">Total Orders</div><div style="font-weight:700;font-size:1.1rem;margin-top:2px">' + infOrders.length + '</div></div>';
      h += '<div><div style="font-size:.7rem;color:var(--sub2);text-transform:uppercase;letter-spacing:.4px">Delivered</div><div style="font-weight:700;font-size:1.1rem;margin-top:2px">' + delivered.length + '</div></div>';
      h += '<div><div style="font-size:.7rem;color:var(--sub2);text-transform:uppercase;letter-spacing:.4px">Earnings</div><div style="font-weight:700;font-size:1.1rem;margin-top:2px;color:var(--soft)">' + fp(totalEarn) + '</div></div>';
      h += '</div>';
      h += '<div style="font-size:.78rem;color:var(--sub2)">Joined: ' + new Date(inf.created_at).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) + '</div>';
      h += '</div>';

      // Expanded orders table
      if (isExpanded) {
        h += '<div style="margin:0 0 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--card);overflow:hidden">';
        if (!infOrders.length) {
          h += '<div class="empty" style="padding:24px"><i class="fas fa-inbox" style="font-size:1.5rem"></i><h3>No referred orders</h3></div>';
        } else {
          h += '<table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th>Amount</th><th>Status</th><th>Commission</th></tr></thead><tbody>';
          for (var j = 0; j < infOrders.length; j++) {
            var o = infOrders[j];
            var pNames = [];
            for (var k = 0; k < (o.items || []).length; k++) {
              var it = o.items[k];
              for (var m = 0; m < Ad.prods.length; m++) {
                if (Ad.prods[m].id === it.product_id) { pNames.push(Ad.prods[m].name); break; }
              }
            }
            // Privacy: sirf initials dikhao, phone/address nahi
            var custInitials = o.customer_name ? o.customer_name.split(' ').map(function(w){return w.charAt(0)+'.'}).join(' ') : 'N/A';
            h += '<tr>';
            h += '<td style="font-size:.8rem">' + o.id + '</td>';
            h += '<td style="color:var(--sub)">' + custInitials + '</td>';
            h += '<td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.82rem">' + pNames.join(', ') + '</td>';
            h += '<td style="font-weight:600">' + fp(o.amount) + '</td>';
            h += '<td>' + sBadge(o.status) + '</td>';
            h += '<td style="color:' + (o.commission > 0 ? 'var(--success)' : 'var(--sub2)') + ';font-weight:600">' + (o.commission > 0 ? fp(o.commission) : '--') + '</td>';
            h += '</tr>';
          }
          h += '</tbody></table>';
        }
        h += '</div>';
      }
    }
  }
  el.innerHTML = h;
}

function togInf(id) {
  Ad.expandedInf = Ad.expandedInf === id ? null : id;
  renderInfs(document.getElementById('mc'));
}

// ── Start ──
document.addEventListener('DOMContentLoaded', initAdmin);
</script>
</body>
</html>
